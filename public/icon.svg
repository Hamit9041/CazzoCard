<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#roseGrad)" />
  <!-- Card 1 (Back angled) -->
  <rect x="96" y="112" width="320" height="200" rx="20" fill="#ffffff" opacity="0.3" transform="rotate(-6 256 212)" />
  <!-- Card 2 (Front main) -->
  <rect x="96" y="156" width="320" height="200" rx="20" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.25))" />
  <!-- Card Magnetic stripe -->
  <rect x="96" y="196" width="320" height="42" fill="#be123c" />
  <!-- Card Chip -->
  <rect x="136" y="270" width="52" height="42" rx="8" fill="#f59e0b" />
  <!-- Card Lines -->
  <rect x="210" y="276" width="160" height="10" rx="5" fill="#e2e8f0" />
  <rect x="210" y="296" width="100" height="10" rx="5" fill="#e2e8f0" />
</svg>
